<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una nota por día 💌</title>
<style>
:root{box-sizing:border-box;--bg:#fdf2f4;--card:#fff;--tx:#3b2a30;--mut:#9b7d86;--ac:#d6537a;--lock:#f0e3e7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d23;--tx:#f6e7ec;--mut:#b99aa5;--ac:#ef7a9d;--lock:#33242b}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d23;--tx:#f6e7ec;--mut:#b99aa5;--ac:#ef7a9d;--lock:#33242b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
header{text-align:center;padding:36px 20px 12px}
h1{margin:0 0 8px;font-size:1.7rem}
header p{margin:0;color:var(--mut);font-size:.98rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;max-width:640px;margin:20px auto;padding:0 16px 40px}
.d{aspect-ratio:1;border:0;border-radius:16px;background:var(--card);color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 8px rgba(214,83,122,.15);cursor:pointer}
.d b{font-size:1.5rem}.d span{font-size:.75rem;color:var(--mut)}
.d.open b{color:var(--ac)}
.d.lock{background:var(--lock);box-shadow:none;cursor:default;opacity:.8}
.d.lock b{color:var(--mut)}
.d.shake{animation:s .35s}
@keyframes s{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#ov.on{display:flex}
#box{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}
#box h2{margin:0 0 14px;font-size:1.2rem;color:var(--ac)}
#box p{line-height:1.6;margin:0 0 14px}
#x{display:block;margin:6px auto 0;border:0;background:var(--ac);color:#fff;font:inherit;padding:10px 26px;border-radius:999px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style></head><body>
<header><h1>Una nota por día 💌</h1><p id="sub"></p></header>
<main class="grid" id="g"></main>
<div id="ov"><div id="box"><h2 id="bt"></h2><div id="bm"></div><button id="x">Cerrar</button></div></div>
<div id="toast"></div>
<script>
/* ====== EDITA AQUÍ ======
   START: fecha del Día 1 (año-mes-día). TOTAL: cuántos días.
   Para cada día pon su título (t) y su mensaje (m). Párrafos separados con una línea en blanco. */
const START="2026-11-04", TOTAL=30;
const NOTES={
1:{t:"No quisiera que te vayas, pero ni modo",m:`Corazón, antes que todo quiero desearte el mejor viaje de todos, sé que no estaba en nuestros planes conocernos en este momento que te vas de viaje, pero así sucedió, quiero que te sientas segura que yo estaré cada día de mi vida cuidando y demostrando que estoy haciendo todo esto por nosotros, te amo mucho, me gusta mucho pasar tiempo contigo, amo estar pegado a ti, y sé que solo esto fortalecerá nuestra relación, sé que me esmeraré en hacerte sentir amada, escuchada, querida y segura, aquí solo existes tú, odio este adiós de 1 mes, pero haremos de todo por estar presente en la vida del otro :)

Cuidaré a Bloom como nuestra hija, es mi adoración igual que tú, y la cuidaré muchísimo, sé cuánto la amas así que claramente la cuidaré como te cuido a ti, no sé qué más decir, de verdad no quería alejarme de ti un mes, pero lamentablemente lo haremos, y no me gustaría alejarme, pero así será, y pues simplemente estaremos con llamadas, videollamadas, mensajes, notas y otras cosas, al final me quedo con una partecita de ti, Bloom nos dará también energía para poder llevar este mes.

Pero bueno, no todo es triste, me va a encantar ver todas tus fotos divirtiéndote y feliz, y cómo estarás de bonita, con tus prendas, quiero muchas fotos tuyas para presumir la hermosa novia que tengo, te amo mucho mi princesita hermosa, eres mi adoración, eres una chica tan guapa, espero te la pases increíble, diviértete como nunca, nosotros estaremos aquí esperándote juntos, te amamos y te deseamos un bonito viaje, cuídate mucho, te necesitamos muchísimo aquí mi princesita, lamentablemente no pasaremos 2 fechas especiales juntos, pero créeme que compensaré el no estar juntos, te amo, espero disfrutes todo, este es el primer mensaje de Miles que enviaré, este mes lo ocuparé para aprender a amarte sin tocarte ❤️‍🩹`}
/* 2:{t:"Título del día 2",m:`Mensaje...`}, */
};
/* ====== FIN ====== */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const dayDate=n=>{const [y,m,d]=START.split("-").map(Number);const x=new Date(y,m-1,d+n-1);return x};
const key=x=>x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const test=location.hash==="#test";
let seen={};try{seen=JSON.parse(localStorage.getItem("seen")||"{}")}catch(e){}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function render(){
  const g=$("g");g.innerHTML="";const t=today();let n=0;
  for(let i=1;i<=TOTAL;i++){
    const dd=dayDate(i),ok=test||key(dd)<=t;if(ok)n++;
    const b=document.createElement("button");
    b.className="d "+(ok?(seen[i]?"open":""):"lock");
    b.innerHTML="<b>"+(ok?(seen[i]?"💗":i):"🔒")+"</b><span>"+(ok?"Día "+i:dd.getDate()+" "+MES[dd.getMonth()])+"</span>";
    b.onclick=()=>{ if(!ok){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);toast("Todavía no, paciencia 😉 Se abre el "+dd.getDate()+" de "+MES[dd.getMonth()]);return}
      openNote(i)};
    g.appendChild(b);
  }
  $("sub").textContent="Cada día se abre una nota nueva. Hoy puedes leer "+n+" de "+TOTAL+".";
}
function openNote(i){
  const nt=NOTES[i];$("bt").textContent="Día "+i+(nt&&nt.t?" · "+nt.t:"");
  const bm=$("bm");bm.innerHTML="";
  const txt=nt&&nt.m?nt.m:"Esta nota está en camino 💌";
  txt.split(/\n\s*\n/).forEach(p=>{const e=document.createElement("p");e.textContent=p;bm.appendChild(e)});
  $("ov").classList.add("on");
  if(nt&&nt.m){seen[i]=1;try{localStorage.setItem("seen",JSON.stringify(seen))}catch(e){}}
}
$("x").onclick=()=>{$("ov").classList.remove("on");render()};
$("ov").onclick=e=>{if(e.target.id==="ov"){$("ov").classList.remove("on");render()}};
render();
</script></body></html>
